<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expensee Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">PERSONAL FINANCE</p>
      <h1>Expensee Tracker</h1>
      <p class="subtitle">Keep track of where your money goes.</p>
    </header>

    <section class="summary" aria-label="Expensee summary">
      <p>Total expensees</p>
      <strong id="total">₹0.00</strong>
    </section>

    <section class="panel">
      <h2>Add an expensee</h2>
      <form id="expensee-form">
        <label for="description">What was it for?</label>
        <input id="description" type="text" placeholder="For example, lunch" required>

        <label for="amount">Amount (₹)</label>
        <input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>

        <label for="category">Category</label>
        <select id="category" required>
          <option value="">Choose a category</option>
          <option>Food</option>
          <option>Travel</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Other</option>
        </select>

        <label for="date">Date</label>
        <input id="date" type="date" required>

        <button type="submit">Add expensee</button>
      </form>
    </section>

    <section class="panel">
      <h2>Your expensees</h2>
      <ul id="expensee-list" aria-live="polite"></ul>
      <p id="empty-message">No expensees yet. Add one above to get started.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
  <script src="script.js"></script>
</html>
